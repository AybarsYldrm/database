name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    # The storage engine has no dependencies at all, so this job needs no install step and
    # nothing to resolve. It is the part that must never be blocked by packaging.
    name: engine (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:engine

      # The identity rules belong in THIS job, not the transport one below, and the reason is
      # the same reason the transport job exists: a check that only runs when an optional
      # package happens to be linkable is a check that stops running the first time it is not.
      #
      # None of these need the transport. The SPIFFE grammar, the admission state machine and
      # the CA vault are deliberately free of it -- the last escalation found in this codebase
      # was an authorisation comparison that silently stopped running, and it survived a green
      # build because the only suite covering it could not load.
      - run: npm run test:zero-trust

      # The signing library, checked out and linked so the guard below runs against the version
      # this package actually declares. It was unpinned ("*") while the library moved to 2.x,
      # which is how certificates that do not match their CSR's private key got issued -- a fault
      # invisible until a TLS handshake somewhere else entirely.
      # Checked out INSIDE the workspace (actions/checkout refuses a path outside it) under a
      # dot-prefixed directory, so nothing walking the tree for sources picks it up.
      - uses: actions/checkout@v4
        continue-on-error: true
        id: ssl
        with:
          repository: AybarsYldrm/ssl
          path: .ssl-dep

      - name: Link @fitfak/ssl
        if: steps.ssl.outcome == 'success'
        run: |
          mkdir -p node_modules/@fitfak
          ln -sfn "$GITHUB_WORKSPACE/.ssl-dep" node_modules/@fitfak/ssl

      - name: Signing library produces certificates that match their key
        if: steps.ssl.outcome == 'success'
        run: node -e "const r=require('./src/ssl-compat').assertSslCompatible(); console.log('@fitfak/ssl', r.version, 'key binding', r.keyMatch); if(!r.keyMatch) process.exit(1);"

      # Chain assembly, verified by openssl rather than by our own parser: producing bytes and
      # reading them back with the same code proves only self-consistency.
      - name: Presented certificate chain builds a path
        if: steps.ssl.outcome == 'success'
        run: npm run test:chain

  transport:
    # The gRPC layer depends on @fitfak/grpc. Until that is published, CI checks out the
    # sibling repository and links it, which also means this job fails loudly if the two
    # drift apart -- exactly the breakage a published-package-only setup would hide until
    # release day.
    name: transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: database

      - uses: actions/checkout@v4
        id: grpc
        continue-on-error: true
        with:
          repository: AybarsYldrm/grpc
          ref: ${{ github.head_ref || github.ref_name }}
          path: grpc

      - name: Fall back to the default branch of @fitfak/grpc
        if: steps.grpc.outcome == 'failure'
        id: grpc-default
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: AybarsYldrm/grpc
          path: grpc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Link @fitfak/grpc
        id: link
        continue-on-error: true
        working-directory: database
        run: node scripts/link-grpc.js ../grpc

      - name: Transport, provisioning and adapter compatibility
        if: steps.link.outcome == 'success'
        working-directory: database
        run: |
          npm run test:secrets-dns
          npm run test:grpc
          npm run test:adapter-compat

      - name: Report a missing transport dependency
        if: steps.link.outcome != 'success'
        run: |
          echo "::warning::@fitfak/grpc could not be checked out or linked; transport tests were skipped."
          echo "Publish @fitfak/grpc, or make AybarsYldrm/grpc reachable from this workflow."
